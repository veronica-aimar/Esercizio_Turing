version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: rubrica-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      # Monta lo script per inizializzare automaticamente il DB al primo avvio del container
      - ./schema_database.sql:/docker-entrypoint-initdb.d/schema_database.sql
      # Persistenza dei dati anche se si spegne il container
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data: